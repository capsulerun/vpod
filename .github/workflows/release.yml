name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0)'
        required: true
        type: string
      snapshot:
        description: 'Snapshot to trace the AOT module against'
        required: false
        default: 'alpine-3.23.0-256mb'
        type: string
      publish_python:
        description: 'Publish Python SDK to PyPI'
        required: false
        default: true
        type: boolean
      publish_npm:
        description: 'Publish TypeScript SDK to npm (browser + Node)'
        required: false
        default: true
        type: boolean
      publish_crate:
        description: 'Publish vpod CLI to crates.io (interpreter-only, no AOT)'
        required: false
        default: true
        type: boolean
      build_snapshots:
        description: 'Rebuild + publish registry snapshots first (only when guest content changed — republishing changes their sha256 and degrades AOT for older releases)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:

  build-snapshots:
    if: ${{ inputs.build_snapshots }}
    uses: ./.github/workflows/build-snapshots.yml
    with:
      version: ${{ inputs.version }}
      publish: true
    secrets: inherit

  build-aot:
    needs: [build-snapshots]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/build-aot.yml
    with:
      snapshot: ${{ inputs.snapshot }}

  # Must exist before build-binaries can attach assets to it.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ inputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — reusing it"
            exit 0
          fi
          gh release create "$TAG" --draft --generate-notes --title "$TAG"

  build-binaries:
    if: ${{ !cancelled() && !failure() }}
    needs: [build-aot, create-release]
    uses: ./.github/workflows/build-binaries.yml
    with:
      tag: v${{ inputs.version }}
      snapshot: ${{ inputs.snapshot }}

  publish-python:
    name: Publish – PyPI (Python SDK)
    if: ${{ !cancelled() && !failure() && inputs.publish_python }}
    needs: build-aot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Inject version
        run: |
          V="${{ inputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$V\"/" sdks/python/pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"$V\"/" sdks/python/vpod/__init__.py

      - name: Fetch AOT engine modules
        uses: actions/download-artifact@v4
        with:
          name: aot-wasm
          path: dist/aot

      - name: Place modules in the SDK
        run: |
          cp dist/aot/vpod_wasi_lib_aot.wasm sdks/python/vpod/
          cp dist/aot/vpod_wasi_lib.wasm     sdks/python/vpod/
          ls -lh sdks/python/vpod/*.wasm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: pip install build twine

      - name: Build distribution
        working-directory: sdks/python
        run: python -m build

      - name: Verify the wheel carries both modules
        working-directory: sdks/python
        run: |
          WHEEL=$(ls dist/*.whl)
          python3 -c "
          import sys, zipfile
          names = zipfile.ZipFile('$WHEEL').namelist()
          for want in ('vpod/vpod_wasi_lib_aot.wasm', 'vpod/vpod_wasi_lib.wasm'):
              if want not in names:
                  sys.exit(f'{want} missing from the wheel')
              print(want, 'ok')
          "

      - name: Publish to PyPI
        working-directory: sdks/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  publish-npm:
    name: Publish – npm (TypeScript SDK)
    if: ${{ !cancelled() && !failure() && inputs.publish_npm }}
    needs: build-aot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch AOT engine modules
        uses: actions/download-artifact@v4
        with:
          name: aot-wasm
          path: dist/aot

      - name: Place the component in the SDK
        run: |
          mkdir -p sdks/typescript/wasm
          cp dist/aot/vpod_wasi_lib_aot.wasm sdks/typescript/wasm/
          ls -lh sdks/typescript/wasm/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Install dependencies
        working-directory: sdks/typescript
        run: npm ci

      - name: Inject version
        working-directory: sdks/typescript
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build
        working-directory: sdks/typescript
        env:
          VPOD_ALLOW_STALE_COMPONENT: '1'
        run: npm run build

      - name: Typecheck and unit tests
        working-directory: sdks/typescript
        run: |
          npm run typecheck
          npm test

      - name: Verify the package ships what its exports promise
        working-directory: sdks/typescript
        run: node --test tests/integration/package-exports.test.mjs

      - name: Verify a real install resolves
        working-directory: sdks/typescript
        run: |
          CHECK="$RUNNER_TEMP/install-check"
          mkdir -p "$CHECK"
          TARBALL=$(npm pack --pack-destination "$CHECK" --silent)
          cd "$CHECK"
          npm init -y >/dev/null
          npm install "./$TARBALL"
          node --input-type=module -e '
            const node = await import("@capsule-run/vpod/node");
            const browser = await import("@capsule-run/vpod/browser");
            const embed = await import("@capsule-run/vpod/embed");
            for (const [name, module] of [["node", node], ["browser", browser], ["embed", embed]]) {
              if (typeof module.Sandbox !== "function") {
                throw new Error(`the ${name} entry point exports no Sandbox`);
              }
              console.log(`${name} entry point ok`);
            }

            // The embed entry carries the worker and is loaded from a blob, so a
            // surviving relative import would break it with an opaque resolution error.
            const { readFileSync } = await import("node:fs");
            const { fileURLToPath } = await import("node:url");
            const embedPath = fileURLToPath(import.meta.resolve("@capsule-run/vpod/embed"));
            const source = readFileSync(embedPath, "utf8");
            if (/\bfrom\s*["\x27]\.[^"\x27]*["\x27]/.test(source)) {
              throw new Error("the embed entry kept a relative import and cannot load from a blob: URL");
            }
            console.log("embed entry ok, self-contained");
          '

      - name: Publish to npm
        working-directory: sdks/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  publish-crate:
    name: Publish – crates.io (vpod)
    if: ${{ !cancelled() && !failure() && inputs.publish_crate }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version
        run: |
          V="${{ inputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$V\"/" crates/vpod/Cargo.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Stub the AOT translation (interpreter-only build)
        run: ./scripts/aot-stub.sh

      - name: Build WASM component (embedded by vpod build.rs)
        run: |
          cargo build --release --target wasm32-wasip2 -p wasi-component --bin vpod-wasi-cli
          cp target/wasm32-wasip2/release/vpod-wasi-cli.wasm crates/vpod/

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p vpod --allow-dirty
