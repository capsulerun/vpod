name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  VPOD_TEST_CHANNEL: https://registry.vpod.sh/tests/v1

jobs:
  rust-fmt:
    name: Rust Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Generate AOT stub
        run: ./scripts/aot-stub.sh

      - name: Build WASM component
        run: cargo build --release --target wasm32-wasip2 -p wasi-component

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  rust-core-tests:
    name: Rust Core Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-wasip2

      - name: Generate AOT stub
        run: ./scripts/aot-stub.sh

      - name: Build WASM component
        run: cargo build --release --target wasm32-wasip2 -p wasi-component

      - name: Run cargo test
        run: cargo test --all --verbose

  build-snapshot:
    name: Build Default Snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install bsdtar
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0

      - name: Build Default Snapshot
        run: ./scripts/build-default-snapshot.sh

  python-sdk-integration:
    name: Python SDK Integration Tests
    runs-on: ubuntu-latest
    needs: build-aot
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch the AOT engine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aot-wasm
          path: dist/aot

      - name: Copy WASM to SDK
        run: cp dist/aot/vpod_wasi_lib_aot.wasm sdks/python/vpod/

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: sdks/python
        run: pip install -e .[dev]

      - name: Run integration tests
        working-directory: sdks/python
        env:
          VPOD_REGISTRY: ${{ env.VPOD_TEST_CHANNEL }}/snapshots.json
        run: pytest tests/ -v -m integration

  typescript-sdk-tests:
    name: TypeScript SDK Tests
    runs-on: ubuntu-latest
    needs: build-aot
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch the AOT engine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aot-wasm
          path: dist/aot

      - name: Copy WASM to SDK
        run: |
          mkdir -p sdks/typescript/wasm
          cp dist/aot/vpod_wasi_lib_aot.wasm sdks/typescript/wasm/

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Install dependencies
        working-directory: sdks/typescript
        run: npm ci

      - name: Build
        working-directory: sdks/typescript
        env:
          VPOD_ALLOW_STALE_COMPONENT: '1'
        run: npm run build

      - name: Typecheck
        working-directory: sdks/typescript
        run: npm run typecheck

      - name: Run unit tests
        working-directory: sdks/typescript
        run: npm test

      - name: Install lz4
        run: sudo apt-get update && sudo apt-get install -y lz4

      - name: Fetch a snapshot for the integration tests
        working-directory: sdks/typescript
        run: |
          ./scripts/fetch-test-snapshot.sh \
            $VPOD_TEST_CHANNEL/alpine-3.23.0-256mb.snap \
            /tmp/alpine-3.23.0-256mb.snap

      - name: Fetch the larger snapshots
        run: |
          ./sdks/typescript/scripts/fetch-test-snapshot.sh \
            $VPOD_TEST_CHANNEL/vsnap-base-512mb.snap \
            /tmp/vsnap-base-512mb.snap
          ./sdks/typescript/scripts/fetch-test-snapshot.sh \
            $VPOD_TEST_CHANNEL/vsnap-base-1024mb.snap \
            /tmp/vsnap-base-1024mb.snap

      - name: Assert the integration tests will actually run
        working-directory: sdks/typescript
        env:
          VPOD_TEST_SNAPSHOT: /tmp/alpine-3.23.0-256mb.snap
        run: node scripts/check-testable.mjs

      - name: Run integration tests
        working-directory: sdks/typescript
        env:
          VPOD_TEST_SNAPSHOT: /tmp/alpine-3.23.0-256mb.snap
          VPOD_TEST_SNAPSHOTS_EXTRA: /tmp/vsnap-base-512mb.snap,/tmp/vsnap-base-1024mb.snap
        run: npm run test:integration

      - name: Set up the oldest supported Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Run tests on the oldest supported Node
        working-directory: sdks/typescript
        env:
          VPOD_TEST_SNAPSHOT: /tmp/alpine-3.23.0-256mb.snap
        run: npm test && npm run test:integration

      - name: Set up the newest LTS Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Run tests on the newest LTS Node
        working-directory: sdks/typescript
        env:
          VPOD_TEST_SNAPSHOT: /tmp/alpine-3.23.0-256mb.snap
        run: npm test && npm run test:integration

  browser-integration:
    name: Browser Integration Tests
    runs-on: ubuntu-latest
    needs: build-aot
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch the AOT engine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aot-wasm
          path: dist/aot

      - name: Copy WASM to SDK
        run: |
          mkdir -p sdks/typescript/wasm
          cp dist/aot/vpod_wasi_lib_aot.wasm sdks/typescript/wasm/

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Install dependencies
        working-directory: sdks/typescript
        run: npm ci

      - name: Build
        working-directory: sdks/typescript
        env:
          VPOD_ALLOW_STALE_COMPONENT: '1'
        run: npm run build

      - name: Install lz4
        run: sudo apt-get update && sudo apt-get install -y lz4

      - name: Fetch a snapshot
        working-directory: sdks/typescript
        run: |
          mkdir -p /tmp/snapshots
          ./scripts/fetch-test-snapshot.sh \
            $VPOD_TEST_CHANNEL/alpine-3.23.0-256mb.snap \
            /tmp/snapshots/alpine-3.23.0-256mb.snap

      - name: Sandbox in a browser, Chrome
        working-directory: sdks/typescript
        run: |
          node dev/run-browser.mjs --browser chrome \
            --snapshot-dir /tmp/snapshots \
            --name alpine:3.23.0 \
            --runs 1

      - name: Sandbox in a browser, Firefox
        working-directory: sdks/typescript
        run: |
          node dev/run-browser.mjs --browser firefox \
            --snapshot-dir /tmp/snapshots \
            --name alpine:3.23.0 \
            --runs 1

      - name: Interrupt, Chrome
        working-directory: sdks/typescript
        run: |
          node dev/run-interrupt.mjs --browser chrome \
            --snapshot-dir /tmp/snapshots \
            --name alpine:3.23.0

      - name: Fetch the larger snapshots
        run: |
          ./sdks/typescript/scripts/fetch-test-snapshot.sh \
            $VPOD_TEST_CHANNEL/vsnap-base-512mb.snap \
            /tmp/snapshots/vsnap-base-512mb.snap
          ./sdks/typescript/scripts/fetch-test-snapshot.sh \
            $VPOD_TEST_CHANNEL/vsnap-base-1024mb.snap \
            /tmp/snapshots/vsnap-base-1024mb.snap
          ln /tmp/snapshots/vsnap-base-512mb.snap  /tmp/snapshots/snap_51248a6f0c3b7d19.snap
          ln /tmp/snapshots/vsnap-base-1024mb.snap /tmp/snapshots/snap_a422ba54177ff2ee.snap

      - name: Guest RAM size, Chrome
        working-directory: sdks/typescript
        run: |
          node dev/run-ram-size.mjs --browser chrome \
            --snapshot-dir /tmp/snapshots \
            --pair vsnap-base-512mb=snap_51248a6f0c3b7d19 \
            --pair vsnap-base-1024mb=snap_a422ba54177ff2ee

      - name: Guest RAM size, Firefox
        working-directory: sdks/typescript
        run: |
          node dev/run-ram-size.mjs --browser firefox \
            --snapshot-dir /tmp/snapshots \
            --pair vsnap-base-512mb=snap_51248a6f0c3b7d19 \
            --pair vsnap-base-1024mb=snap_a422ba54177ff2ee

  embed-browser-integration:
    name: Embed Browser Integration Tests
    runs-on: ubuntu-latest
    needs: build-aot

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch the AOT engine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aot-wasm
          path: dist/aot

      - name: Copy WASM to SDK
        run: |
          mkdir -p sdks/typescript/wasm
          cp dist/aot/vpod_wasi_lib_aot.wasm sdks/typescript/wasm/

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Install dependencies
        working-directory: sdks/typescript
        run: npm ci

      - name: Build
        working-directory: sdks/typescript
        env:
          VPOD_ALLOW_STALE_COMPONENT: '1'
        run: npm run build

      - name: Install lz4
        run: sudo apt-get update && sudo apt-get install -y lz4

      - name: Fetch a snapshot
        working-directory: sdks/typescript
        run: |
          mkdir -p /tmp/snapshots
          ./scripts/fetch-test-snapshot.sh \
            $VPOD_TEST_CHANNEL/alpine-3.23.0-256mb.snap \
            /tmp/snapshots/alpine-3.23.0-256mb.snap

      - name: Embed packaging, Chrome
        working-directory: sdks/typescript
        run: |
          node dev/run-embed.mjs --browser chrome \
            --snapshot-dir /tmp/snapshots \
            --name alpine-3.23.0-256mb.snap

      - name: Embed packaging, Firefox
        working-directory: sdks/typescript
        run: |
          node dev/run-embed.mjs --browser firefox \
            --snapshot-dir /tmp/snapshots \
            --name alpine-3.23.0-256mb.snap

  typescript-base-build:
    name: TypeScript Base Tier Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-wasip2

      - name: Generate AOT stub
        run: ./scripts/aot-stub.sh

      - name: Build WASM library
        run: cargo build --release --target wasm32-wasip2 -p wasi-component --lib

      - name: Copy WASM to SDK
        run: |
          mkdir -p sdks/typescript/wasm
          cp target/wasm32-wasip2/release/vpod_wasi_lib.wasm sdks/typescript/wasm/

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Install dependencies
        working-directory: sdks/typescript
        run: npm ci

      - name: Build and unit test the interpreter tier
        working-directory: sdks/typescript
        run: |
          npm run build -- --tier base
          npm test

  build-aot:
    uses: ./.github/workflows/build-aot.yml

  typescript-sdk-performance:
    name: TypeScript SDK Performance
    runs-on: ubuntu-latest
    needs: build-aot

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch the AOT engine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aot-wasm
          path: dist/aot

      - name: Copy WASM to SDK
        run: |
          mkdir -p sdks/typescript/wasm
          cp dist/aot/vpod_wasi_lib_aot.wasm sdks/typescript/wasm/

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Install dependencies
        working-directory: sdks/typescript
        run: npm ci

      - name: Build
        working-directory: sdks/typescript
        env:
          VPOD_ALLOW_STALE_COMPONENT: '1'
        run: npm run build

      - name: Install lz4
        run: sudo apt-get update && sudo apt-get install -y lz4

      - name: Fetch the recorded snapshot
        working-directory: sdks/typescript
        run: |
          ./scripts/fetch-test-snapshot.sh \
            $VPOD_TEST_CHANNEL/alpine-3.23.0-256mb.snap \
            /tmp/alpine-3.23.0-256mb.snap

      - name: Measure
        working-directory: sdks/typescript
        env:
          VPOD_TEST_SNAPSHOT: /tmp/alpine-3.23.0-256mb.snap
          VPOD_PERF_BASELINE: ${{ env.VPOD_TEST_CHANNEL }}/perf.json
          VPOD_PERF_OUTPUT: /tmp/typescript-performance.json
          VPOD_PERF_REQUIRE_STRICT: '1'
        run: npm run test:perf

      - name: Archive the numbers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typescript-performance
          path: /tmp/typescript-performance.json
          if-no-files-found: warn

  python-sdk-performance:
    name: Python SDK Performance
    runs-on: ubuntu-latest
    needs: build-aot

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch the AOT engine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aot-wasm
          path: dist/aot

      - name: Copy WASM to SDK
        run: cp dist/aot/vpod_wasi_lib_aot.wasm sdks/python/vpod/

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: sdks/python
        run: pip install -e .[dev]

      - name: Measure
        working-directory: sdks/python
        env:
          VPOD_REGISTRY: ${{ env.VPOD_TEST_CHANNEL }}/snapshots.json
          VPOD_PERF_OUTPUT: /tmp/python-performance.json
          VPOD_PERF_REQUIRE_STRICT: '1'
        run: pytest tests/test_performance.py -m performance -v

      - name: Archive the numbers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-performance
          path: /tmp/python-performance.json
          if-no-files-found: warn

